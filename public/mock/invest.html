<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>주식 탭 모양</title>
<!-- 투자 탭 시안 (예시 데이터, 사용자 요청 2026-10-30). 화면 CSS 는 해시가 붙어 있어 index.html 에서 찾아 붙인다 -->
<script>
  fetch("/").then((r) => r.text()).then((h) => {
    const href = h.match(/\/assets\/[^"]+\.css/)?.[0];
    if (href) document.head.append(Object.assign(document.createElement("link"), { rel: "stylesheet", href }));
  });
</script>
<style>
  .mock { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
  .alloc { list-style: none; margin: 6px 0 12px; padding: 0; }
  .alloc li { padding: 8px 0; border-top: 1px solid var(--line); }
  .alloc li:first-child { border-top: 0; }
  .alloc .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .alloc .pct { font-variant-numeric: tabular-nums; font-weight: 600; }
  .alloc small { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .alloc .gap-over { color: var(--ink); }
  /* 막대: 채움 = 지금 비율, 세로선 = 목표 비율 (같은 잣대 0~60%) */
  .tbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; }
  .tbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-2); }
  .tbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); }
  .legend { color: var(--ink-2); font-size: 12px; display: flex; gap: 12px; margin: 2px 0 0; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 8px; border-radius: 2px; background: var(--ink-2); margin-right: 4px; vertical-align: 0; }
  .legend span.t::before { width: 2px; height: 10px; background: var(--accent); }
  .amt .after { display: block; font-size: 12px; color: var(--ink-2); }
  .acct + .acct { margin-top: 12px; }
  .alloc .sub { padding: 6px 0 0 12px; border-left: 2px solid var(--line); margin: 6px 0 0 2px; }
  .alloc .sub .row { font-size: 13px; padding: 3px 0; }
  .alloc .sub .row span:first-child { color: var(--ink-2); }
  .grp { padding: 10px 16px 2px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; color: var(--ink-2); }
  .grp b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="icon"></span>
    <div class="period"><h1>2026년 10월</h1><span>10.20 – 11.19</span></div>
    <span class="icon"></span>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" onclick="location.href='/'">예정</button>
    <button type="button" role="tab" onclick="location.href='/#spend'">생활비</button>
    <button type="button" role="tab" onclick="location.href='/#balance'">잔액</button>
    <button type="button" role="tab" class="on" aria-selected="true">투자</button>
  </nav>

  <main class="layout">
    <aside class="summary">
      <p class="caption">투자 평가금액 <span class="mock">예시 데이터</span></p>
      <p class="total" id="total"></p>
      <p class="put">신한투자증권 · 10.27 기준 · 매달 21일 <b>500,000원</b></p>
      <h3>자산 배분 · 지금 / 목표</h3>
      <ul class="alloc" id="alloc"></ul>
      <p class="legend"><span>지금</span><span class="t">목표</span></p>
      <p class="note">목표 비율은 사용자가 정해 주면 에이전트가 넣습니다. 지금 비율은 평가금액으로 계산합니다.</p>
    </aside>

    <div class="detail">
      <section class="acct" aria-label="이번 달 넣을 돈 나누기">
        <header><h2>11.21 넣을 500,000원 나누기</h2><span class="sum">목표에서 모자란 곳부터</span></header>
        <ul class="lines" id="buy"></ul>
      </section>
      <section class="acct" aria-label="세부 항목">
        <header><h2>세부 항목</h2><span class="sum" id="hsum"></span></header>
        <ul class="lines" id="hold"></ul>
      </section>
    </div>
  </main>
</div>
<script>
  // 예시: 실제 보유 종목이 아니다. 목표 = 자산군 비율(전체 대비) × 세부 비율(자산군 안에서)
  const G = [
    { name: "주식", target: 60, items: [
      { name: "미국 대형주", fund: "S&P500 ETF", qty: 38, value: 900000, target: 60 },
      { name: "미국 기술주", fund: "나스닥100 ETF", qty: 14, value: 420000, target: 25 },
      { name: "국내 주식", fund: "코스피200 ETF", qty: 4, value: 150000, target: 15 } ] },
    { name: "채권", target: 20, items: [
      { name: "미국 국채", fund: "미국채 10년 ETF", qty: 18, value: 200000, target: 70 },
      { name: "국내 단기채", fund: "단기채권 ETF", qty: 1, value: 50000, target: 30 } ] },
    { name: "금", target: 10, items: [
      { name: "금", fund: "KRX 금현물", qty: null, value: 180000, target: 100 } ] },
    { name: "현금", target: 10, items: [
      { name: "예수금", fund: "증권 계좌 현금", qty: null, value: 116965, target: 100 } ] },
  ];
  const ADD = 500000;
  const won = (n) => `${Math.round(n).toLocaleString("ko-KR")}원`;
  const pct = (n) => `${n.toFixed(1)}%`;
  const sum = (xs) => xs.reduce((a, b) => a + b, 0);
  for (const g of G) g.value = sum(g.items.map((i) => i.value));
  const total = sum(G.map((g) => g.value));
  const after = total + ADD;
  // 넣을 돈 나누기: 세부 항목마다 목표 금액에서 모자란 만큼, 모자란 합이 넣을 돈보다 크면 비율대로 줄인다(천 원 단위)
  const leaves = G.flatMap((g) => g.items.map((i) => ({ g, i, goal: (after * g.target * i.target) / 10000 })));
  const short = leaves.map((l) => Math.max(0, l.goal - l.i.value));
  const k = Math.min(1, ADD / sum(short));
  leaves.forEach((l, n) => (l.i.buy = Math.floor((short[n] * k) / 1000) * 1000));
  const most = leaves.reduce((a, b) => (b.i.buy > a.i.buy ? b : a));
  most.i.buy += ADD - sum(leaves.map((l) => l.i.buy)); // 끝수는 가장 많이 넣는 곳에
  for (const g of G) g.buy = sum(g.items.map((i) => i.buy));

  document.getElementById("total").textContent = won(total);
  const SCALE = 80; // 막대 잣대 0~80%
  const gapText = (d) => (Math.abs(d) < 0.5 ? "목표와 같음" : d > 0 ? `${d.toFixed(1)}%p 많음` : `${(-d).toFixed(1)}%p 모자람`);
  document.getElementById("alloc").innerHTML = G.map((g) => {
    const now = (g.value / total) * 100;
    const sub = g.items.length > 1
      ? `<div class="sub">${g.items.map((i) => `<div class="row"><span>${i.name}</span><small>${pct((i.value / g.value) * 100)} / ${i.target}%</small></div>`).join("")}</div>`
      : "";
    return `<li><div class="row"><span>${g.name}</span><span><span class="pct">${pct(now)}</span> <small>/ 목표 ${g.target}%</small></span></div>
      <div class="tbar"><i style="width:${(now / SCALE) * 100}%"></i><b style="left:${(g.target / SCALE) * 100}%"></b></div>
      <small>${won(g.value)} · ${gapText(now - g.target)}</small>${sub}</li>`;
  }).join("");
  document.getElementById("buy").innerHTML = G.map((g) =>
    `<li class="grp"><span>${g.name}</span><b>${won(g.buy)}</b></li>` +
    g.items.map((i) => {
      const nv = i.value + i.buy;
      return `<li class="line"><span class="name">${i.name}<small>${i.fund}</small></span>
        <span class="amt">${won(i.buy)}<span class="after">넣은 뒤 전체의 ${pct((nv / after) * 100)} · 목표 ${pct((g.target * i.target) / 100)}</span></span></li>`;
    }).join(""),
  ).join("");
  document.getElementById("hsum").textContent = won(total);
  document.getElementById("hold").innerHTML = G.map((g) =>
    `<li class="grp"><span>${g.name}</span><b>${won(g.value)}</b></li>` +
    g.items.map((i) => `<li class="line"><span class="name">${i.fund}<small>${i.name}${i.qty ? ` · ${i.qty}주` : ""}</small></span><span class="amt">${won(i.value)}<span class="after">${g.name} 안 ${pct((i.value / g.value) * 100)} · 전체 ${pct((i.value / total) * 100)}</span></span></li>`).join(""),
  ).join("");
</script>
</body>
</html>

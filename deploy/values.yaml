image:
  repository: ghcr.io/youseonghyeon/moneylog
  # CI가 main push마다 커밋 SHA로 갱신한다. 첫 CI 전에는 latest.
  tag: "65803c7abfdbc867aa6a5e0d065c91164899ce7e"
  pullPolicy: IfNotPresent

# ghcr 패키지가 private이면 pull secret 이름을 넣는다. public이면 비워 둔다.
imagePullSecrets: []

# 남겨 둘 옛 ReplicaSet 수. 현재 것 + 옛것 3개까지 유지된다.
revisionHistoryLimit: 3

service:
  port: 8080

ingress:
  # 끔 (2026-10-27): 공유기가 80/443 을 traefik 으로 넘겨 host 없는 Ingress 가 공인 IP 로 노출됐다
  enabled: false
  # k3s 기본 Ingress 컨트롤러
  className: traefik
  # 비우면 모든 호스트 이름을 받는다 (http://<노드 IP>/). 이름으로 가르려면 넣는다 (예: moneylog.home)
  host: ""
  # TLS 를 traefik 에서 끝낼 때 인증서 Secret 이름 (같은 namespace). 비우면 http
  tlsSecretName: ""

persistence:
  # SQLite 파일(/data/moneylog.db). 비우면 클러스터 기본 StorageClass (k3s: local-path — 노드 디스크에 묶인다)
  storageClass: ""
  size: 1Gi

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 192Mi

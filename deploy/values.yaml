image:
  repository: ghcr.io/youseonghyeon/moneylog
  # CI가 main push마다 커밋 SHA로 갱신한다. 첫 CI 전에는 latest.
  tag: "380fd89df9cd34029328609a3025b83790e438af"
  pullPolicy: IfNotPresent

# ghcr 패키지가 private이면 pull secret 이름을 넣는다. public이면 비워 둔다.
imagePullSecrets: []

# 남겨 둘 옛 ReplicaSet 수. 현재 것 + 옛것 2개까지 유지된다.
revisionHistoryLimit: 2

service:
  port: 8080

ingress:
  # https://<hostname>.<tailnet>.ts.net 으로 tailnet 안에서만 열린다.
  # 금융 데이터라 funnel(공인 인터넷 노출)은 차트에서 뺐다 — 켜지 않는다.
  hostname: moneylog

persistence:
  # SQLite 파일(/data/moneylog.db). 비우면 클러스터 기본 StorageClass (k3s: local-path — 노드 디스크에 묶인다)
  storageClass: ""
  size: 1Gi

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 192Mi

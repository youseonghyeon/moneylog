apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneylog
  labels:
    app: moneylog
spec:
  # SQLite 파일 하나를 RWO PVC 에 두므로 Pod 는 하나뿐이다. 배포 때 옛 Pod 를 먼저 내린다 (몇 초 끊김).
  replicas: 1
  strategy:
    type: Recreate
  # 롤백용으로 남기는 옛 ReplicaSet 수 (기본 10)
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: moneylog
  template:
    metadata:
      labels:
        app: moneylog
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # node:alpine 이미지의 node 사용자 (uid/gid 1000). fsGroup 으로 /data 에 쓸 수 있게 한다
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: moneylog
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required (set by CI)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            - name: DB_PATH
              value: /data/moneylog.db
            - name: TZ
              value: Asia/Seoul
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: moneylog-data
        - name: tmp
          emptyDir: {}
